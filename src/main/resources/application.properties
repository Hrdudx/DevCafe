spring.application.name=devcafe

spring.datasource.url=jdbc:h2:file:./database.db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
# Devolve a mensagem de erro dos Services para o front-end exibir.
spring.web.error.include-message=always

# Chave usada para assinar os tokens JWT (precisa ter pelo menos 32 caracteres).
jwt.secret=devcafe-web2-n2-chave-secreta-do-token-jwt-2026

# Upload de arquivos (fotos dos produtos). O limite de 2 MB por foto é conferido no ProdutoService;
# aqui o limite do Spring fica um pouco maior para a mensagem amigável do Service aparecer.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
devcafe.uploads.dir=uploads
