# Configuração usada só nos testes automatizados (mvnw test):
# banco H2 em memória, criado do zero a cada execução, sem mexer no database.db de verdade.
spring.application.name=devcafe-testes
spring.datasource.url=jdbc:h2:mem:devcafe-testes;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.web.error.include-message=always
jwt.secret=chave-usada-somente-nos-testes-automatizados-2026
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
devcafe.uploads.dir=target/uploads-testes
